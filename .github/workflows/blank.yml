name: Test Ultroid Python

on:
  push:
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check bot.py syntax
        run: python -m py_compile plugins/bot.py
